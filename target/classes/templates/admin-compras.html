<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Validación de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a href="/admin/rifas" class="btn btn-secondary mb-3">← Volver a Admin Rifas</a>
        <h2>Gestión y Validación de Pagos</h2>
        <table class="table table-striped shadow-sm bg-white rounded mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rifa</th>
                    <th>Boletos</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${compras}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.usuario.nombre + ' (' + c.usuario.email + ')'}">Usuario</td>
                    <td th:text="${c.rifa.titulo}">Rifa</td>
                    <td>
                        <span th:each="b : ${c.boletos}" class="badge bg-secondary me-1" th:text="${b.numeroBoleto}">1</span>
                    </td>
                    <td th:text="'$' + ${c.montoTotal}">$0.00</td>
                    <td>
                        <span class="badge" th:classappend="${c.estadoPago == 'PAGADO' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${c.estadoPago}">PENDIENTE</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/compras/validar/{id}(id=${c.id})}" method="post" class="d-inline">
                            <input type="hidden" name="estado" value="PAGADO">
                            <button type="submit" class="btn btn-success btn-sm">Marcar Pagado</button>
                        </form>
                        <form th:action="@{/admin/compras/validar/{id}(id=${c.id})}" method="post" class="d-inline">
                            <input type="hidden" name="estado" value="RECHAZADO">
                            <button type="submit" class="btn btn-danger btn-sm">Rechazar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
