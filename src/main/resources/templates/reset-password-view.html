<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
</head>
<body>
    <div style="width: 300px; margin: 50px auto; font-family: Arial, sans-serif;">
        <h2>Nueva Contraseña</h2>

        <!-- Mensajes de error o éxito -->
        <div th:if="${error}" style="color: red;" th:text="${error}"></div>
        <div th:if="${exito}" style="color: green;" th:text="${exito}"></div>

        <form th:action="@{/reset-password}" method="post">
            <!-- El token debe ir como input oculto -->
            <input type="hidden" name="token" th:value="${token}" />
        
            <label for="nuevaPassword">Nueva contraseña:</label>
            <input type="password" id="nuevaPassword" name="nuevaPassword" required />
        
            <button type="submit">Actualizar contraseña</button>
        </form>
    </div>
</body>
</html>
