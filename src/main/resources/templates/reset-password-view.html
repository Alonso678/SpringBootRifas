<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Rifas Públicas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Nueva Contraseña</h3>
                <p class="text-muted small">Ingresa tu nueva contraseña para continuar</p>
            </div>

            <!-- Mensajes de error o éxito -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show small" role="alert" th:text="${error}"></div>
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show small" role="alert" th:text="${exito}"></div>

            <form th:action="@{/reset-password}" method="post">
                <!-- El token debe ir como input oculto -->
                <input type="hidden" name="token" th:value="${token}" />
            
                <div class="mb-3">
                    <label for="nuevaPassword" class="form-label small fw-semibold">Nueva contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="nuevaPassword" name="nuevaPassword" placeholder="••••••••" required />
                    </div>
                </div>
            
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary fw-semibold">Actualizar contraseña</button>
                </div>
            </form>

            <!-- Enlaces de navegación -->
            <!-- <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <a href="/login" class="text-decoration-none small fw-semibold d-block mb-2" style="color: #0284c7 !important;">Ir al inicio de sesión</a>
                <a href="/" class="text-decoration-none small fw-semibold" style="color: #475569 !important;">
                    <i class="fa-solid fa-house me-1"></i> Volver al Inicio
                </a>
            </div> -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
