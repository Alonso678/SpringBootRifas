<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo ?: 'FORTUNARIFAS'}">FORTUNARIFAS</title>
    <link th:href="@{/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .navbar {
            background: rgba(11, 15, 25, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            color: #000;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <!-- Canvas de Fondo (Se mantiene en todas las vistas) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Aquí se inyectará el contenido de cada vista -->
    <div th:replace="${view} ?: ~{::content}">
        <div th:fragment="content"></div>
    </div>

    <!-- Script de Monedas con Destellos Estelares (Fondo global) -->
    <script>
        const cv = document.getElementById('bg-canvas');
        const x = cv.getContext('2d');
        let w, h, parts = [], coins = [];

        function rs() {
            w = cv.width = window.innerWidth;
            h = cv.height = window.innerHeight;
        }
        window.addEventListener('resize', rs);
        rs();

        function drawStarSparkle(ctx, cx, cy, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < 4; i++) {
                let x = cx + Math.cos(rot) * outerRadius;
                let y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.closePath();
            ctx.fill();
        }

        for(let i = 0; i < 80; i++) {
            parts.push({
                x: Math.random() * w,
                y: Math.random() * h,
                v: (Math.random() * 0.4 + 0.1),
                r: Math.random() * 1.5 + 0.5
            });
        }

        function spawnCoin() {
            coins.push({
                x: Math.random() * w,
                y: -40,
                v: 1.8 + Math.random() * 2,
                s: 14 + Math.random() * 6,
                a: Math.random() * Math.PI,
                spinSpeed: 0.04 + Math.random() * 0.04,
                sparkleAlpha: Math.random() * Math.PI,
                sparkleOffset: { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 }
            });
        }
        setInterval(spawnCoin, 550);

        function frame() {
            x.fillStyle = "#0b0f19";
            x.fillRect(0, 0, w, h);

            for(let p of parts) {
                p.y += p.v;
                if(p.y > h) p.y = 0;
                x.beginPath();
                x.fillStyle = "rgba(255, 215, 0, 0.3)";
                x.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                x.fill();
            }

            for(let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.y += c.v;
                c.a += c.spinSpeed;
                c.sparkleAlpha += 0.08;

                x.save();
                x.translate(c.x, c.y);
                x.rotate(c.a);

                x.shadowColor = "#f59e0b";
                x.shadowBlur = 12;

                x.fillStyle = "#fbbf24";
                x.beginPath();
                x.ellipse(0, 0, c.s * 0.6, c.s, 0, 0, Math.PI * 2);
                x.fill();

                x.strokeStyle = "#fff";
                x.lineWidth = 1.5;
                x.stroke();

                let twinkle = Math.abs(Math.sin(c.sparkleAlpha));
                if (twinkle > 0.3) {
                    x.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
                    x.shadowColor = "#ffffff";
                    x.shadowBlur = 15;
                    drawStarSparkle(x, c.sparkleOffset.x, c.sparkleOffset.y, 6, 2);
                }

                x.restore();

                if(c.y > h + 40) {
                    coins.splice(i, 1);
                }
            }

            x.shadowBlur = 0;
            requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>
</html>
