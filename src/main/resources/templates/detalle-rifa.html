<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}"></html>
<head>
    <meta charset="UTF-8">
    <title>Detalle de Rifa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .boleto-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); 
            gap: 10px; 
            max-height: 450px; 
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid #e2e8f0; 
            background: #f8fafc; 
            border-radius: 0.5rem;
        }
        .boleto-item { 
            padding: 10px 5px; 
            text-align: center; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: all 0.15s ease-in-out;
        }
        .DISPONIBLE { background-color: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; }
        .DISPONIBLE:hover { background-color: #cbd5e1; transform: scale(1.05); }
        .APARTADO { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; cursor: not-allowed; opacity: 0.7; }
        .PAGADO { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; cursor: not-allowed; opacity: 0.7; }
        
        .boleto-checkbox { display: none; }
        .boleto-checkbox:checked + .DISPONIBLE { 
            background-color: #0d6efd !important; 
            color: white !important; 
            border-color: #0a58ca !important; 
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
            transform: scale(1.05);
        }

        .badge-disponible { background-color: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; }
        .badge-apartado { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-pagado { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5">
        <a href="/" class="btn btn-outline-secondary mb-3 btn-sm fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i>Volver al Inicio</a>
        
        <div class="card shadow-sm p-4 mb-4 border-0 rounded-4 bg-white">
            <h2 class="fw-bold text-dark" th:text="${rifa.titulo}">Título</h2>
            <p class="text-muted" th:text="${rifa.descripcion}"></p>
            <h4 class="text-primary fw-bold mt-2">Precio por Boleto: $<span th:text="${rifa.precioBoleto}">0.00</span></h4>
        </div>

        <div class="card shadow-sm p-4 border-0 rounded-4 bg-white">
            <h3 class="fw-bold h4 mb-3"><i class="fa-solid fa-list-check text-primary me-2"></i>Selecciona tus Boletos</h3>
            
            <div class="mb-3 d-flex gap-3 small text-muted align-items-center">
                <span class="d-flex align-items-center"><span class="badge badge-disponible p-2 me-1 border"
                        style="width: 18px; height: 18px; display: inline-block;"></span> Disponible</span>
                <span class="d-flex align-items-center"><span class="badge badge-apartado p-2 me-1 border"
                        style="width: 18px; height: 18px; display: inline-block;"></span> Apartado</span>
                <span class="d-flex align-items-center"><span class="badge badge-pagado p-2 me-1 border"
                        style="width: 18px; height: 18px; display: inline-block;"></span> Vendido/Pagado</span>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger shadow-sm" th:text="${mensajeError}"></div>
            
            <form th:action="@{/comprar}" method="post">
                <input type="hidden" name="rifaId" th:value="${rifa.id}">
                <div class="boleto-grid mb-4 shadow-inner">
                    <div th:each="b : ${boletos}">
                        <div th:if="${b.estado == 'DISPONIBLE'}">
                            <input type="checkbox" name="boletosSeleccionados" th:value="${b.id}" th:id="'b_' + ${b.id}" class="boleto-checkbox">
                            <label th:for="'b_' + ${b.id}" class="boleto-item DISPONIBLE w-100 shadow-sm" th:text="${b.numeroBoleto}"></label>
                        </div>
                        <div th:unless="${b.estado == 'DISPONIBLE'}" class="boleto-item shadow-sm" th:classappend="${b.estado}" th:text="${b.numeroBoleto}" title="No disponible"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow">Apartar Boletos Seleccionados</button>
            </form>
        </div>
    </div>
</body>
</html>
