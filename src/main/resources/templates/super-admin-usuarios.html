<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Super Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-black bg-opacity-75 text-light min-vh-100">

    <!-- Barra de navegación superior con efecto oscuro y semitransparente -->
    <nav class="navbar navbar-dark bg-dark bg-opacity-75 border-bottom border-secondary shadow-sm mb-4 backdrop-blur">
        <div class="container">
            <span class="navbar-brand fw-bold text-light">Panel de Super Administrador</span>
            <a href="/" class="btn btn-outline-light btn-sm">🏠 Volver al Inicio</a>
        </div>
    </nav>

    <!-- Contenedor principal tipo tablet centrado -->
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-9">
                <div
                    class="card bg-dark bg-opacity-50 text-light shadow-lg border border-secondary p-4 rounded-4 backdrop-blur">

                    <h2 class="mb-4 text-center text-md-start fw-bold text-white">Gestión de Usuarios</h2>

                    <!-- Alertas -->
                    <div th:if="${mensajeExito}"
                        class="alert alert-success alert-dismissible fade show bg-success text-white border-0"
                        role="alert">
                        <span th:text="${mensajeExito}"></span>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"
                            aria-label="Close"></button>
                    </div>
                    <div th:if="${mensajeError}"
                        class="alert alert-danger alert-dismissible fade show bg-danger text-white border-0"
                        role="alert">
                        <span th:text="${mensajeError}"></span>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"
                            aria-label="Close"></button>
                    </div>

                    <!-- Barra de Búsqueda -->
                    <form th:action="@{/super-admin/usuarios}" method="get" class="mb-4">
                        <div class="input-group shadow-sm">
                            <input type="text" name="buscar" class="form-control bg-dark text-light border-secondary"
                                placeholder="Buscar por correo (ej. darkalon)..." th:value="${terminoBusqueda}"
                                style="color-scheme: dark;">
                            <button class="btn btn-secondary px-4 text-white" type="submit">Buscar</button>
                            <a th:href="@{/super-admin/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
                        </div>
                    </form>

                    <!-- Mensaje inicial -->
                    <div th:if="${terminoBusqueda == null or terminoBusqueda.isEmpty()}"
                        class="alert bg-black bg-opacity-25 text-light border border-secondary text-center shadow-sm p-4">
                        <h5 class="alert-heading text-white">🔍 Búsqueda de usuarios</h5>
                        <p class="mb-0 text-secondary">Escribe un término en el buscador superior para encontrar cuentas
                            y administrar sus roles.</p>
                    </div>

                    <!-- Mensaje sin resultados -->
                    <div th:if="${terminoBusqueda != null and !terminoBusqueda.isEmpty() and (usuarios == null or usuarios.isEmpty())}"
                        class="alert alert-warning text-center shadow-sm bg-dark text-warning border-warning">
                        No se encontraron usuarios que coincidan con "<strong><span
                                th:text="${terminoBusqueda}"></span></strong>".
                    </div>

                    <!-- Resultados en formato de Tarjetas internas responsivas -->
                    <div class="row row-cols-1 g-3" th:if="${usuarios != null and !usuarios.isEmpty()}">
                        <div class="col" th:each="usuario : ${usuarios}">
                            <div
                                class="card h-100 shadow-sm border border-secondary bg-black bg-opacity-25 p-3 rounded-3 text-light">
                                <div
                                    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                                    <div>
                                        <div class="d-flex align-items-center gap-2 mb-1">
                                            <span class="badge bg-secondary text-light">ID: <span
                                                    th:text="${usuario.id}"></span></span>
                                            <span class="badge"
                                                th:classappend="${usuario.rol == 'ROLE_SUPER_ADMIN' ? 'bg-danger' : (usuario.rol == 'ROLE_ADMIN' ? 'bg-primary' : 'bg-dark border border-secondary')}"
                                                th:text="${usuario.rol}"></span>
                                        </div>
                                        <h6 class="text-info fw-bold mb-0" th:text="${usuario.email}"></h6>
                                    </div>

                                    <!-- Acciones -->
                                    <div>
                                        <div th:if="${usuario.id != 1}">
                                            <form
                                                th:action="@{/super-admin/usuarios/{id}/cambiar-rol(id=${usuario.id})}"
                                                method="post" class="d-flex align-items-center gap-2">
                                                <select name="nuevoRol"
                                                    class="form-select form-select-sm bg-dark text-light border-secondary">
                                                    <option value="ROLE_USER"
                                                        th:selected="${usuario.rol == 'ROLE_USER'}">Usuario Normal
                                                    </option>
                                                    <option value="ROLE_ADMIN"
                                                        th:selected="${usuario.rol == 'ROLE_ADMIN'}">Administrador
                                                    </option>
                                                </select>
                                                <button type="submit"
                                                    class="btn btn-sm btn-outline-light text-nowrap">Guardar</button>
                                            </form>
                                        </div>
                                        <div th:if="${usuario.id == 1}" class="text-secondary small fst-italic">
                                            🔒 Cuenta Principal
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
