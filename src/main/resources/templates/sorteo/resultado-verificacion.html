<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Resultado de Verificación - Sorteo</title>
    <!-- Tailwind CSS CDN para un diseño rápido y moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 text-center">

        <!-- Icono de Estado Dinámico -->
        <div class="mb-4 flex justify-center">
            <span th:if="${valido and (esGanador != null and esGanador)}"
                class="bg-emerald-100 text-emerald-600 p-4 rounded-full text-3xl">🎉</span>
            <span th:if="${valido and (esGanador == null or !esGanador)}"
                class="bg-blue-100 text-blue-600 p-4 rounded-full text-3xl">🎫</span>
            <span th:if="${!valido}" class="bg-rose-100 text-rose-600 p-4 rounded-full text-3xl">⚠️</span>
        </div>

        <!-- Título principal -->
        <h1 class="text-xl font-bold text-slate-800 mb-2">Verificación de Boleto</h1>

        <!-- Mensaje del Servidor -->
        <p class="text-sm font-medium p-3 rounded-lg mb-6"
            th:class="${(valido != null and valido) ? ((esGanador != null and esGanador) ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-blue-50 text-blue-700 border border-blue-200') : 'bg-rose-50 text-rose-700 border border-rose-200'}"
            th:text="${mensaje}">
            Resultado de la verificación...
        </p>

        <!-- Detalles del Boleto (si existe) -->
        <div th:if="${boleto != null}"
            class="bg-slate-50 rounded-xl p-4 text-left text-xs text-slate-600 space-y-2 mb-6 border border-slate-200">
            <div class="flex justify-between">
                <span class="font-bold text-slate-700">ID Registro:</span>
                <span th:text="${boleto.id}">114</span>
            </div>
            <div class="flex justify-between">
                <span class="font-bold text-slate-700">Número de Boleto:</span>
                <span class="font-semibold text-indigo-600" th:text="'#' + ${boleto.numeroBoleto}">#2</span>
            </div>
            <div class="flex justify-between" th:if="${boleto.rifa != null}">
                <span class="font-bold text-slate-700">Sorteo:</span>
                <span th:text="${boleto.rifa.descripcion}">Descripción</span>
            </div>
        </div>

        <!-- Botón de acción para regresar a la página de inicio -->
        <a th:href="@{/}"
            class="block w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-xl transition duration-200 text-sm text-center">
            Regresar al Inicio
        </a>

    </div>

</body>

</html>
