<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Sorteos y Rifas</title>
    <!-- Enlace robusto a Bootstrap -->
    <link th:href="@{/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        /* Tarjeta principal con tono gris claro translúcido y efecto cristal */
        .card, .form-container {
            background: rgba(203, 213, 225, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            color: #0f172a !important;
        }
        .card h3, .card h4, .card h5, .card p, .card label, .card .form-label {
            color: #1e293b !important;
        }
        .form-control, .input-group-text {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(148, 163, 184, 0.8) !important;
            color: #0f172a !important;
            border-radius: 0.5rem !important;
        }
        .form-control::placeholder {
            color: #64748b !important;
        }
        .form-control:focus {
            background: #ffffff !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25) !important;
        }
        .input-group-text {
            background: rgba(226, 232, 240, 0.9) !important;
            color: #475569 !important;
        }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: 700;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            color: #000;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 480px;">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center shadow mb-3" style="width: 65px; height: 65px;">
                    <i class="fa-solid fa-key fa-xl"></i>
                </div>
                <h3 class="fw-bold">Recuperar Cuenta</h3>
                <p class="small text-muted">Ingresa tu correo electrónico y te enviaremos los pasos para restablecer tu contraseña.</p>
            </div>

            <!-- Alerta de éxito si existe -->
            <div th:if="${mensajeExito}" class="alert alert-success py-2 small text-center border-0 shadow-sm" th:text="${mensajeExito}"></div>

            <form th:action="@{/recuperar-password}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold small">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="tucorreo@email.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-3 rounded-pill shadow mb-3">Enviar Instrucciones</button>
            </form>

            <div class="text-center mt-3 pt-2">
                <a href="/" class="text-decoration-none small fw-semibold" style="color: #475569 !important;">
                    <i class="fa-solid fa-house me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
