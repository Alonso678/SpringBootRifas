<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - FORTUNARIFAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        .card-auth {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            font-weight: bold;
        }
        .btn-warning:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card-auth text-center">
        <div class="mb-4">
            <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                <i class="fa-solid fa-key fs-4"></i>
            </div>
            <h3 class="mt-3 fw-bold">Recuperar Cuenta</h3>
            <p class="text-muted small">Ingresa tu correo electrónico y te enviaremos los pasos para restablecer tu contraseña.</p>
        </div>

        <!-- Alerta de éxito/error opcional -->
        <div th:if="${mensajeError}" class="alert alert-danger py-2 small" role="alert">
            <span th:text="${mensajeError}"></span>
        </div>

        <form th:action="@{/recuperar-password}" method="post">
            <div class="mb-3 text-start">
                <label class="form-label text-white small">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-light"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="tucooreo@email.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 mt-2">Enviar instrucciones</button>
        </form>

        <div class="mt-4">
            <a href="/login" class="text-warning text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Inicio de Sesión</a>
        </div>
    </div>

</body>
</html>
