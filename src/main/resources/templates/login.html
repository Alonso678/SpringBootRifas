<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">

</html>

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sorteos y Rifas</title>
    <link th:href="@{/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .login-card {
            background: #111827;
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: #1f2937;
            border-color: #f59e0b;
            color: #fff;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
        }

        .input-group-text {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: 700;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            color: #000;
        }

        /* Tarjeta principal con tono gris claro translúcido y bordes muy definidos */
        .card,
        .form-container {
            background: rgba(203, 213, 225, 0.85);
            /* Gris claro translúcido */
            backdrop-filter: blur(16px);
            /* Efecto de cristal esmerilado */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            /* Borde claro y bien definido */
            border-radius: 1.5rem;
            /* Esquinas redondeadas prominentes */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            /* Sombra profunda para que flote */
            color: #0f172a !important;
            /* Texto interno oscuro para máxima legibilidad */
        }

        /* Textos dentro de la tarjeta clara */
        .card h3,
        .card h4,
        .card h5,
        .card p,
        .card label,
        .card .form-label {
            color: #1e293b !important;
        }

        /* Campos de entrada (inputs) claros y bien definidos */
        .form-control,
        .input-group-text {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(148, 163, 184, 0.8) !important;
            color: #0f172a !important;
            border-radius: 0.5rem !important;
        }

        .form-control::placeholder {
            color: #64748b !important;
        }

        .form-control:focus {
            background: #ffffff !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25) !important;
        }

        /* Iconos dentro de los inputs */
        .input-group-text {
            background: rgba(226, 232, 240, 0.9) !important;
            color: #475569 !important;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 440px;">
        <div class="card login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center shadow mb-3"
                    style="width: 65px; height: 65px;">
                    <i class="fa-solid fa-dice fa-xl"></i>
                </div>
                <h3 class="fw-bold text-white">Iniciar Sesión</h3>
                <p class="text-muted small">Ingresa a tu cuenta para gestionar tus boletos</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small text-center border-0 shadow-sm"><i
                    class="fa-solid fa-triangle-exclamation me-1"></i>Credenciales inválidas.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small text-center border-0 shadow-sm"><i
                    class="fa-solid fa-check me-1"></i>Sesión cerrada correctamente.</div>
            <div th:if="${mensajeExito}" class="alert alert-success py-2 small text-center border-0 shadow-sm"
                th:text="${mensajeExito}"></div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="username" name="username" class="form-control" placeholder="tucorreo@email.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-gold w-100 py-3 rounded-pill shadow">Ingresar al Sistema</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <a href="/registro" class="text-decoration-none small fw-semibold"
                    style="color: #0284c7 !important;">¿No tienes
                    cuenta? Regístrate aquí</a>
            </div>

            <div class="text-center mt-3">
                <a href="/recuperar-password" class="text-dark text-decoration-none small">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="text-center mt-3 pt-2">
                <a href="/" class="text-decoration-none small fw-semibold" style="color: #475569 !important;">
                    <i class="fa-solid fa-house me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
    <!-- Script de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            let mensaje = '';

            if (!username) {
                mensaje = 'Por favor, ingresa tu correo electrónico.';
            } else if (!username.includes('@') || !username.includes('.')) {
                mensaje = 'El correo electrónico no es válido.';
            }else if (!password) {
                mensaje = 'Por favor, ingresa tu contraseña.';
            }

            if (mensaje) {
                event.preventDefault(); // Detiene el envío del formulario

                Swal.fire({
                    icon: 'warning',
                    title: 'Atención requerida',
                    text: mensaje,
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#f59e0b',
                    background: '#111827',
                    color: '#f8fafc'
                });
            }
        });
    </script>
</body>

</html>
