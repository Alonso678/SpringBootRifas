<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}"></html>
<head>
    <meta charset="UTF-8">
    <title>Mis Compras - Sorteos y Rifas</title>
    <link th:href="@{/css/bootstrap.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        .content-card {
            background: #111827;
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .table-dark-custom {
            color: #f8fafc;
            background-color: #111827;
        }
        .table-dark-custom th {
            background-color: #1f2937;
            color: #eab308;
            border-bottom: 2px solid #374151;
            font-weight: 600;
        }
        .table-dark-custom td {
            background-color: #111827;
            color: #d1d5db;
            border-color: #1f2937;
            vertical-align: middle;
        }
        .table-dark-custom tbody tr:hover td {
            background-color: #1f2937;
            color: #fff;
        }
        .btn-gold-outline {
            color: #f59e0b;
            border: 1px solid #f59e0b;
            background: transparent;
            transition: all 0.2s ease;
        }
        .btn-gold-outline:hover {
            background-color: #f59e0b;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <a href="/" class="btn btn-gold-outline mb-4 rounded-pill px-4 btn-sm fw-semibold"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Inicio</a>
        
        <div class="content-card p-4 p-md-5">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center shadow me-3" style="width: 50px; height: 50px;">
                    <i class="fa-solid fa-ticket-simple fa-lg"></i>
                </div>
                <div>
                    <h2 class="fw-bold text-white mb-0">Mis Compras y Estado de Pagos</h2>
                    <p class="text-muted small mb-0">Consulta el estado actual de tus boletos y participaciones</p>
                </div>
            </div>

            <div th:if="${mensajeExito}" class="alert alert-success border-0 shadow-sm" th:text="${mensajeExito}"></div>
            
            <div class="table-responsive rounded-3 overflow-hidden shadow-sm border border-secondary border-opacity-25">
                <table class="table table-dark-custom mb-0">
                    <thead>
                        <tr>
                            <th class="py-3">ID Compra</th>
                            <th class="py-3">Rifa</th>
                            <th class="py-3">Boletos</th>
                            <th class="py-3">Total</th>
                            <th class="py-3">Estado de Pago</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${compras}">
                            <td class="fw-bold text-warning" th:text="'#' + ${c.id}">1</td>
                            <td class="fw-semibold text-white" th:text="${c.rifa.titulo}">Rifa</td>
                            <td>
                                <span th:each="b : ${c.boletos}" class="badge bg-secondary bg-opacity-50 text-warning border border-warning border-opacity-25 me-1 mb-1" th:text="${b.numeroBoleto}">1</span>
                            </td>
                            <td class="fw-bold text-success" th:text="'$' + ${c.montoTotal}">$0.00</td>
                            <td>
                                <span class="badge px-3 py-2" th:classappend="${c.estadoPago == 'PAGADO' ? 'bg-success text-white' : (c.estadoPago == 'PENDIENTE' ? 'bg-warning text-dark' : 'bg-danger text-white')}" th:text="${c.estadoPago}">PENDIENTE</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
