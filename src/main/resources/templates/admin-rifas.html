<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración de Rifas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <a href="/" class="btn btn-secondary">← Volver al Inicio</a>
            <a href="/admin/compras" class="btn btn-info">Ver Todas las Compras y Validar Pagos</a>
        </div>
        <h2>Gestión de Rifas</h2>
        <div class="card shadow-sm p-4 mb-4">
            <h4>Crear Nueva Rifa</h4>
            <form th:action="@{/admin/rifas/guardar}" th:object="${nuevaRifa}" method="post">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio por Boleto ($)</label>
                    <input type="number" step="0.01" th:field="*{precioBoleto}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Total de Boletos (ej. 100)</label>
                    <input type="number" th:field="*{totalBoletos}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha del Sorteo</label>
                    <input type="datetime-local" th:field="*{fechaSorteo}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Crear Rifa y Generar Boletos</button>
            </form>
        </div>
    </div>
</body>
</html>
