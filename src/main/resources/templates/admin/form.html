<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}"></html>
<head>
    <meta charset="UTF-8">
    <title>Gestión de Rifa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2 class="mb-4 text-warning">Formulario de Rifa</h2>
        
        <form th:action="@{/admin/rifas/guardar}" th:object="${rifa}" method="post">
            <!-- ID oculto para distinguir entre crear y actualizar -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" class="form-control" th:field="*{titulo}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" th:field="*{descripcion}" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio por Boleto ($)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{precioBoleto}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Total de Boletos</label>
                <input type="number" class="form-control" th:field="*{totalBoletos}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha y Hora del Sorteo</label>
                <input type="datetime-local" class="form-control" th:field="*{fechaSorteo}" required />
            </div>

            <div class="mb-3">
                <label class="form-label">URL de la Imagen</label>
                <input type="text" class="form-control" th:field="*{imagenUrl}" required />
            </div>
            
            <div class="mb-3">
                <label class="form-label">Estado de la Rifa</label>
                <select class="form-select bg-dark text-white border-secondary" th:field="*{estado}" required>
                    <option value="ACTIVA">ACTIVA</option>
                    <option value="FINALIZADA">FINALIZADA</option>
                </select>
            </div>

            <button type="submit" class="btn btn-warning fw-bold">Guardar Rifa</button>
            <a href="/" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
